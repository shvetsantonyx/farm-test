<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Farming</title>
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <div id="image-background">
            <img src="space.gif" id="background-image" alt="Фоновое изображение">
        </div>
        <div class="container">
            <h1>Фармилка</h1>
            <!-- <h3>Привет, <div id="username"><h3>!</h3></div>!</h3> -->
            <h3><p id="username"></p></h3>

            <!-- Кнопка для ежедневной награды -->
            <button id="dailyRewardButton">Ежедневная награда</button>

            <h1><div id="coins"></div></h1>
            <h1><div id="coins_counter"></div></h1>
            <div id="coin-container">
                <img src="coin.png" id="coin" alt="Крутящаяся монета">
            </div>
            <button id="btn">Фармить</button> 
            <h2 id="out"></h2>
        </div>

        <!-- Модальное окно -->
        <div id="rewardModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Ежедневные награды</h2>

                <!-- Кнопки для каждого дня -->
                <div class="reward-buttons">
                    <button id="day1" class="reward-button" disabled>День 1</button>
                    <button id="day2" class="reward-button" disabled>День 2</button>
                    <button id="day3" class="reward-button" disabled>День 3</button>
                    <button id="day4" class="reward-button" disabled>День 4</button>
                    <button id="day5" class="reward-button" disabled>День 5</button>
                    <button id="day6" class="reward-button" disabled>День 6</button>
                    <button id="day7" class="reward-button" disabled>День 7</button>
                </div>
            </div>
        </div>

        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <script src="app.js"></script>
    </body>
</html>
